# Local development infrastructure + optional full stack.
#   Infra only:   docker compose -f infrastructure/docker/docker-compose.yml up -d postgres redis minio minio-init
#   Full stack:   docker compose -f infrastructure/docker/docker-compose.yml --profile app up --build
name: zatma

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zatma
      POSTGRES_PASSWORD: zatma
      POSTGRES_DB: zatma
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zatma"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zatma
      MINIO_ROOT_PASSWORD: zatma-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 zatma zatma-secret; do sleep 1; done;
      mc mb --ignore-existing local/zatma-assets; mc anonymous set none local/zatma-assets"

  api:
    profiles: [app]
    build: { context: ../.., dockerfile: infrastructure/docker/api.Dockerfile }
    env_file: ../../apps/api/.env
    environment:
      DATABASE_URL: postgresql://zatma:zatma@postgres:5432/zatma
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    profiles: [app]
    build: { context: ../.., dockerfile: infrastructure/docker/web.Dockerfile }
    environment:
      API_INTERNAL_URL: http://api:4000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  postgres-data:
  redis-data:
  minio-data:
