# Local development infrastructure + optional full stack.
#   Infra only:   docker compose -f infrastructure/docker/docker-compose.yml up -d postgres redis s3 s3-init
#   Full stack:   docker compose -f infrastructure/docker/docker-compose.yml --profile app up --build
name: zatma

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zatma
      POSTGRES_PASSWORD: zatma
      POSTGRES_DB: zatma
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zatma"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Local S3 emulator (the open-source MinIO server is archived). Production uses Cloudflare R2.
  s3:
    image: motoserver/moto:5.2.5
    ports: ["9000:9000"]
    environment:
      MOTO_PORT: "9000"

  s3-init:
    image: amazon/aws-cli:2.27.0
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: zatma
      AWS_SECRET_ACCESS_KEY: zatma-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "until aws --endpoint-url http://s3:9000 s3api list-buckets >/dev/null 2>&1; do sleep 1; done;
      aws --endpoint-url http://s3:9000 s3api create-bucket --bucket zatma-assets || true;
      aws --endpoint-url http://s3:9000 s3api put-bucket-cors --bucket zatma-assets --cors-configuration
      '{\"CORSRules\":[{\"AllowedOrigins\":[\"http://localhost:3000\"],\"AllowedMethods\":[\"PUT\",\"GET\"],\"AllowedHeaders\":[\"*\"]}]}'"

  api:
    profiles: [app]
    build: { context: ../.., dockerfile: infrastructure/docker/api.Dockerfile }
    env_file: ../../apps/api/.env
    environment:
      DATABASE_URL: postgresql://zatma:zatma@postgres:5432/zatma
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://s3:9000
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    profiles: [app]
    build: { context: ../.., dockerfile: infrastructure/docker/web.Dockerfile }
    environment:
      API_INTERNAL_URL: http://api:4000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  postgres-data:
  redis-data:
